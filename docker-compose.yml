version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: ERP_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ERP_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # redis:
  #   image: redis:7-alpine
  #   container_name: ERP-redis
  #   command: redis-server --requirepass ${REDIS_PASSWORD}
  #   restart: unless-stopped
  #   ports:
  #     - "6380:6379"
  #   networks:
  #     - ERP_external_network
  #   volumes:
  #     - redis_data:/data
  
  redis:
    image: redis:7-alpine
    container_name: ERP_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data


volumes:
  postgres_data:
  redis_data:

networks:
  ERP_external_network:
    external: false

